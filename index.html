<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Virtual</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>

  <header>
    <h1>Biblioteca Virtual</h1>
    <nav>
      <a href="#catalogo">Catálogo de Livros</a>
      <a href="#sugestoes">Sugerir Aquisição</a>
    </nav>
  </header>

  <main>

    <!-- Catálogo -->
    <section id="catalogo">
      <h2>Nosso Acervo</h2>

      <label for="busca">Pesquisar livro:</label>
      <input type="search" id="busca" placeholder="Digite o título...">

      <div class="livros">
        <article class="livro">O Senhor dos Anéis</article>
        <article class="livro">1984</article>
        <article class="livro">Dom Casmurro</article>
        <article class="livro">Fundação</article>
        <article class="livro">O Pequeno Príncipe</article>
        <article class="livro">Fahrenheit 451</article>
      </div>
    </section>

    <!-- Sugestões -->
    <section id="sugestoes">
      <h2>Sugerir Novo Livro</h2>

      <form action="#" method="post" id="formulario">
        <label for="nome">Seu Nome</label>
        <input type="text" id="nome">

        <label for="titulo">Título da Obra</label>
        <input type="text" id="titulo">

        <button type="submit">Enviar Sugestão</button>
      </form>

      <p id="mensagem"></p>
    </section>

  </main>

  <footer>
    <p>Desenvolvimento Web - Biblioteca Virtual</p>
    <a href="#">Voltar ao topo</a>
  </footer>

</body>
</html>
